// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Declared here, not in variables.gradle: that file is applied after this block runs.
    ext.kotlinVersion = '1.9.25'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        // Background sync is written in Kotlin: the Health Connect client exposes
        // suspend functions only, which are impractical to call from Java.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
